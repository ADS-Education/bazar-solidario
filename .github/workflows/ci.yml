name: CI do Bazar Solidário

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  build-test:
    name: Build e testes de integração
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: bazar
          POSTGRES_PASSWORD: ci-test-password
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres -d bazar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BAZAR_DB_PASSWORD: ci-test-password
      BAZAR_PASSWORD: ci-app-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build com Maven
        run: mvn -B verify
      - name: Preparar banco PostgreSQL
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: docker exec -i "$POSTGRES_CONTAINER" psql -v ON_ERROR_STOP=1 -U postgres -d bazar < banco.sql
      - name: Testar login, doação e venda pela API
        env:
          BAZAR_DB_URL: jdbc:postgresql://127.0.0.1:${{ job.services.postgres.ports[5432] }}/bazar?connectTimeout=5
        run: |
          mvn -B dependency:build-classpath -Dmdep.outputFile=target/runtime-classpath.txt -DincludeScope=runtime
          java -cp "target/classes:$(cat target/runtime-classpath.txt)" bazar.Bazar > app.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --silent --fail --max-time 2 http://127.0.0.1:8080/ > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --silent --show-error --fail --max-time 5 http://127.0.0.1:8080/ > /dev/null
          python3 - <<'PY'
          import http.cookiejar
          import json
          import re
          import unittest
          from urllib.error import HTTPError
          from urllib.parse import urlencode
          from urllib.request import HTTPCookieProcessor, Request, build_opener

          class BazarIntegrationTest(unittest.TestCase):
              def setUp(self):
                  self.client = build_opener(HTTPCookieProcessor(http.cookiejar.CookieJar()))

              def request(self, path, fields=None):
                  body = None if fields is None else urlencode(fields).encode()
                  request = Request('http://127.0.0.1:8080/api/' + path, data=body, headers={'X-Bazar': '1'})
                  try:
                      response = self.client.open(request, timeout=5)
                  except HTTPError as error:
                      response = error
                  with response:
                      return response.code, response.read().decode()

              def login(self):
                  self.assertEqual(self.request('entrar', {'usuario': 'demo', 'senha': 'ci-app-password'})[0], 200)

              def available_ids(self):
                  status, body = self.request('pecas')
                  self.assertEqual(status, 200)
                  return {piece['id'] for piece in json.loads(body)}

              def test_consulta_exige_login(self):
                  self.assertEqual(self.request('pecas')[0], 401)

              def test_doacao_rejeita_descricao_vazia(self):
                  self.login()
                  self.assertEqual(self.request('pecas', {'descricao': ''})[0], 400)

              def test_doacao_e_venda_atualizam_pecas_disponiveis(self):
                  self.login()
                  status, body = self.request('pecas', {'descricao': 'Camiseta do teste CI'})
                  self.assertEqual(status, 201)
                  match = re.search(r'#([0-9]+)', body)
                  self.assertIsNotNone(match, body)
                  piece_id = int(match.group(1))
                  self.assertIn(piece_id, self.available_ids())
                  self.assertEqual(self.request('vendas', {'id': piece_id})[0], 201)
                  self.assertNotIn(piece_id, self.available_ids())
                  self.assertEqual(self.request('vendas', {'id': piece_id})[0], 409)

          unittest.main(verbosity=2)
          PY
      - name: Mostrar log do aplicativo em caso de falha
        if: failure()
        run: |
          if [ -f app.log ]; then cat app.log; fi
